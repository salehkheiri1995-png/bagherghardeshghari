name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-build:
    name: Lint & Build Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./test.db"

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./test.db"
          JWT_SECRET: "test-secret-key-for-ci-pipeline-32-chars"
          JWT_EXPIRES_IN: "7d"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_SITE_NAME: "VisitIran CI"
          STRIPE_SECRET_KEY: "sk_test_dummy_key_for_build_check"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_dummy_key_for_build_check"
          STRIPE_WEBHOOK_SECRET: "whsec_dummy_webhook_secret_for_build"
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: "ci@test.com"
          SMTP_PASS: "dummy-password"
